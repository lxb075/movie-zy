<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 影视推荐墙</title>
    <style>
        /* ==================== 全局重置与基础样式 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0A0C10;
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ==================== 颜色变量 ==================== */
        :root {
            --bg-primary: #0A0C10;
            --bg-secondary: #12161F;
            --accent-purple: #7C3AED;
            --accent-cyan: #06B6D4;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        /* ==================== Banner区域 ==================== */
        .banner {
            position: relative;
            height: 400px;
            overflow: hidden;
            background: linear-gradient(135deg, #0A0C10 0%, #12161F 100%);
        }

        .banner-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 0%, #0A0C10 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .banner-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(124, 58, 237, 0.5);
            z-index: 1;
        }

        .banner-subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            z-index: 1;
        }

        /* ==================== 主容器 ==================== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ==================== 搜索与筛选区域 ==================== */
        .controls {
            background-color: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
        }

        .filter-sort-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 1;
        }

        .filter-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: rgba(124, 58, 237, 0.3);
            color: white;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            color: white;
        }

        .sort-select {
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .sort-select:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        /* ==================== 加载状态 ==================== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================== 卡片网格 ==================== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* ==================== 卡片样式 ==================== */
        .card {
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(30px);
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(124, 58, 237, 0.15);
        }

        .card-image-wrapper {
            position: relative;
            aspect-ratio: 4/5;
            overflow: hidden;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-image {
            transform: scale(1.1);
        }

        .card-image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(10, 12, 16, 0.9) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover .card-image-overlay {
            opacity: 1;
        }

        .card-content {
            padding: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            flex: 1;
            margin-right: 10px;
        }

        .card-score {
            display: flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .card-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-type {
            background: rgba(124, 58, 237, 0.2);
            color: var(--accent-purple);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .card-date {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .card-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-actions {
            display: flex;
            gap: 16px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 8px 0;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            color: white;
        }

        .action-btn.liked {
            color: #EF4444;
        }

        .action-btn.collected {
            color: var(--accent-cyan);
        }

        /* ==================== 详情弹窗 ==================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--accent-purple);
        }

        .modal-header {
            position: relative;
            height: 400px;
        }

        .modal-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, var(--bg-secondary), transparent);
        }

        .modal-content {
            padding: 30px;
            position: relative;
            margin-top: -100px;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .modal-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .modal-meta-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .modal-description {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .modal-actions {
            display: flex;
            gap: 16px;
        }

        .modal-action-btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-action-btn.primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            color: white;
        }

        .modal-action-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* ==================== 底部 ==================== */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 60px;
        }

        /* ==================== 响应式布局 ==================== */
        @media (max-width: 768px) {
            .banner {
                height: 300px;
            }

            .banner-title {
                font-size: 2rem;
            }

            .filter-sort-row {
                flex-direction: column;
                align-items: stretch;
            }

            .sort-select {
                width: 100%;
            }

            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }

            .modal-header {
                height: 300px;
            }

            .modal-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .banner {
                height: 250px;
            }

            .banner-title {
                font-size: 1.6rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Banner区域 -->

    <!-- 主容器 -->

            <div class="filter-sort-row">

        <!-- 卡片网格 -->

    <!-- 详情弹窗 -->

        // ==================== 状态管理 ====================
        let state = {
            currentFilter: 'all',
            currentSort: 'latest',
            searchQuery: '',
            likedMovies: JSON.parse(localStorage.getItem('likedMovies') || '[]'),
            collectedMovies: JSON.parse(localStorage.getItem('collectedMovies') || '[]')
        };

        // ==================== AI图片生成 ====================
        function generateImageUrl(prompt, ratio) {
            const encodedPrompt = encodeURIComponent(prompt);
            let imageSize = ratio === '21:9' ? '1792x768' : '800x1000';
            return `https://trae-api-cn.mchost.guru/api/ide/v1/text-to-image?prompt=${encodedPrompt}&image_size=${imageSize}`;
        }

        // ==================== 初始化图片 ====================
        function initializeImages() {
            // Banner图片 (21:9)
            const bannerImg = document.getElementById('bannerImage');
            bannerImg.src = generateImageUrl('cinematic movie theater dark atmosphere purple neon lights film grain', '21:9');
            bannerImg.onerror = function() {
                this.style.display = 'none';
            };
            
            // 卡片图片 (4:5)
            moviesData.forEach((movie, index) => {
                const prompts = [
                    'interstellar movie poster epic space science fiction nasa wormhole black hole',
                    'demon slayer kimetsu no yaiba tanjiro anime poster dark fantasy',
                    'inception movie poster surreal spinning top leonardo dicaprio dream world',
                    'attack on titan anime poster eren colossal titan wall maria',
                    'kung fu panda dreamworks animation poster po dragon warrior',
                    'your name kimi no na wa anime poster makoto shinkai sky comet',
                    'spirited away studio ghibli anime poster chihiro haku bathhouse',
                    'avengers marvel superhero movie poster iron man captain america',
                    'one punch man anime poster saitama serious face',
                    'tenet movie poster christopher nolan time inversion red blue',
                    'jujutsu kaisen anime poster itadori yuji sukuna',
                    'zootopia disney animation poster judy hopps nick wilde'
                ];
                movie.cover = generateImageUrl(prompts[index] || 'movie poster', '4:5');
            });
        }

        // ==================== 渲染卡片 ====================
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            
            let filteredData = [...moviesData];

            // 搜索过滤
            if (state.searchQuery) {
                filteredData = filteredData.filter(movie => 
                    movie.title.toLowerCase().includes(state.searchQuery.toLowerCase())
                );
            }

            // 分类过滤
            if (state.currentFilter !== 'all') {
                filteredData = filteredData.filter(movie => 
                    movie.type.includes(state.currentFilter) || 
                    movie.genre.includes(state.currentFilter)
                );
            }

            // 排序
            switch (state.currentSort) {
                case 'latest':
                    filteredData.sort((a, b) => new Date(b.date) - new Date(a.date));
                    break;
                case 'popular':
                    filteredData.sort((a, b) => b.hot - a.hot);
                    break;
                case 'score':
                    filteredData.sort((a, b) => b.score - a.score);
                    break;
            }

            filteredData.forEach((movie, index) => {
                const card = createCardElement(movie, index);
                grid.appendChild(card);
            });

            // 触发动画
            setTimeout(() => observeCards(), 100);
        }

        function createCardElement(movie, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.transitionDelay = `${index * 0.1}s`;
            
            const isLiked = state.likedMovies.includes(movie.id);
            const isCollected = state.collectedMovies.includes(movie.id);
            
            const fallbackImage = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500"><rect fill="#12161F" width="400" height="500"/><text x="50%" y="50%" fill="#94A3B8" font-size="60" text-anchor="middle" dominant-baseline="middle">🎬</text></svg>');
            
            const cardHTML = `
                <div class="card-image-wrapper">
                    <img class="card-image" src="${movie.cover}" alt="${movie.title}" loading="lazy">
                    <div class="card-image-overlay"></div>
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <h3 class="card-title">${movie.title}</h3>
                        <span class="card-score">⭐ ${movie.score}</span>
                    </div>
                    <div class="card-meta">
                        <span class="card-type">${movie.type.join(' / ')}</span>
                        <span class="card-date">${movie.date}</span>
                    </div>
                    <p class="card-desc">${movie.desc}</p>
                    <div class="card-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${movie.id}, event)">
                            ❤️ <span>${formatNumber(movie.like + (isLiked ? 1 : 0))}</span>
                        </button>
                        <button class="action-btn ${isCollected ? 'collected' : ''}" onclick="toggleCollect(${movie.id}, event)">
                            🔖 <span>${formatNumber(movie.collect + (isCollected ? 1 : 0))}</span>
                        </button>
                    </div>
                </div>
            `;
            
            card.innerHTML = cardHTML;
            
            const img = card.querySelector('.card-image');
            img.onerror = function() {
                this.src = fallbackImage;
            };
            
            card.addEventListener('click', (e) => {
                if (!e.target.closest('.action-btn')) {
                    openModal(movie);
                }
            });
            
            return card;
        }

        function formatNumber(num) {
            if (num >= 10000) {
                return (num / 10000).toFixed(1) + 'w';
            }
            return num.toLocaleString();
        }

        // ==================== 滚动动画 ====================
        function observeCards() {
            const cards = document.querySelectorAll('.card');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });
            
            cards.forEach(card => observer.observe(card));
        }

        // ==================== 点赞收藏 ====================
        function toggleLike(id, event) {
            event.stopPropagation();
            const index = state.likedMovies.indexOf(id);
            if (index > -1) {
                state.likedMovies.splice(index, 1);
            } else {
                state.likedMovies.push(id);
            }
            localStorage.setItem('likedMovies', JSON.stringify(state.likedMovies));
            renderCards();
        }

        function toggleCollect(id, event) {
            event.stopPropagation();
            const index = state.collectedMovies.indexOf(id);
            if (index > -1) {
                state.collectedMovies.splice(index, 1);
            } else {
                state.collectedMovies.push(id);
            }
            localStorage.setItem('collectedMovies', JSON.stringify(state.collectedMovies));
            renderCards();
        }

        // ==================== 详情弹窗 ====================
        function openModal(movie) {
            const modal = document.getElementById('modalOverlay');
            document.getElementById('modalImage').src = movie.cover;
            document.getElementById('modalImage').onerror = function() {
                this.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500"><rect fill="#12161F" width="400" height="500"/><text x="50%" y="50%" fill="#94A3B8" font-size="40" text-anchor="middle" dominant-baseline="middle">🎬</text></svg>');
            };
            
            const isLiked = state.likedMovies.includes(movie.id);
            const isCollected = state.collectedMovies.includes(movie.id);
            
            document.getElementById('modalContent').innerHTML = `
                <h2 class="modal-title">${movie.title}</h2>
                <div class="modal-meta">
                    <span class="modal-meta-item">⭐ ${movie.score}分</span>
                    <span class="modal-meta-item">${movie.type.join(' / ')}</span>
                    <span class="modal-meta-item">${movie.genre.join(' / ')}</span>
                    <span class="modal-meta-item">${movie.date}</span>
                </div>
                <p class="modal-description">${movie.desc}</p>
                <div class="modal-actions">
                    <button class="modal-action-btn primary" onclick="toggleLikeInModal(${movie.id})">
                    ❤️ ${isLiked ? '已点赞' : '点赞'} (${formatNumber(movie.like + (isLiked ? 1 : 0))})
                    </button>
                    <button class="modal-action-btn secondary" onclick="toggleCollectInModal(${movie.id})">
                    🔖 ${isCollected ? '已收藏' : '收藏'} (${formatNumber(movie.collect + (isCollected ? 1 : 0))})
                    </button>
                </div>
            `;
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function toggleLikeInModal(id) {
            const index = state.likedMovies.indexOf(id);
            if (index > -1) {
                state.likedMovies.splice(index, 1);
            } else {
                state.likedMovies.push(id);
            }
            localStorage.setItem('likedMovies', JSON.stringify(state.likedMovies));
            const movie = moviesData.find(m => m.id === id);
            if (movie) {
                openModal(movie);
                renderCards();
            }
        }

        function toggleCollectInModal(id) {
            const index = state.collectedMovies.indexOf(id);
            if (index > -1) {
                state.collectedMovies.splice(index, 1);
            } else {
                state.collectedMovies.push(id);
            }
            localStorage.setItem('collectedMovies', JSON.stringify(state.collectedMovies));
            const movie = moviesData.find(m => m.id === id);
            if (movie) {
                openModal(movie);
                renderCards();
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ==================== 事件监听 ====================
        document.getElementById('searchInput').addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            renderCards();
        });

        document.getElementById('filterButtons').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                state.currentFilter = e.target.dataset.filter;
                renderCards();
            }
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            state.currentSort = e.target.value;
            renderCards();
        });

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ==================== 初始化 ====================
        function init() {
            initializeImages();
            
            // 模拟加载
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                renderCards();
            }, 1000);
        }

        // 启动
        init();
    </script>
</body>
</html>
