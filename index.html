<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 影视推荐墙</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Banner区域 -->
    <header class="banner">
        <img class="banner-image" id="bannerImage" src="" alt="Banner">
        <div class="theme-toggle">
            <button class="theme-btn" id="themeBtn">🌓</button>
        </div>
        <div class="banner-overlay">
            <h1 class="banner-title">🎬 影视推荐墙</h1>
            <p class="banner-subtitle">发现精彩，分享感动</p>
        </div>
    </header>

    <!-- 主容器 -->
    <div class="container">
        <!-- 搜索与筛选 -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索电影或动漫...">
            </div>
            <div class="filter-sort-row">
                <div class="filter-buttons" id="filterButtons">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="电影">电影</button>
                    <button class="filter-btn" data-filter="动漫">动漫</button>
                    <button class="filter-btn" data-filter="动作">动作</button>
                    <button class="filter-btn" data-filter="喜剧">喜剧</button>
                    <button class="filter-btn" data-filter="科幻">科幻</button>
                    <button class="filter-btn" data-filter="悬疑">悬疑</button>
                </div>
                <select class="sort-select" id="sortSelect">
                    <option value="latest">按最新</option>
                    <option value="popular">按热度</option>
                    <option value="score">按评分</option>
                </select>
            </div>
        </div>

        <!-- 加载状态 -->
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>加载中...</p>
        </div>

        <!-- 卡片网格 -->
        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">×</button>
            <div class="modal-header">
                <img class="modal-image" id="modalImage" src="" alt="">
                <div class="modal-gradient"></div>
            </div>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <!-- 底部 -->
    <footer class="footer">
        <p>© 2025 影视推荐墙 · 精选优质内容</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
